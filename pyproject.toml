[project]
name = "paddock"
version = "0.1.0"
description = "Bilingual RAG + SQL agent over Hong Kong Jockey Club racing data"
requires-python = ">=3.13"

dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # Ingestion
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.0",
    # CLI / logging
    "typer>=0.15",
    "structlog>=24.4",
]

# Installed per-phase so `uv sync` stays fast early on. `embed` pulls torch (~2 GB)
# and is not needed until T7; `agent` and `ui` land in Phase 1 and Phase 5.
[project.optional-dependencies]
embed = ["sentence-transformers>=3.3", "torch>=2.5"]
agent = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "openai>=1.57",       # also serves DeepSeek and Gemini via base_url override
    "anthropic>=0.40",
    "langfuse>=2.55",
]
ui = ["streamlit>=1.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-beautifulsoup4",
]

[project.scripts]
paddock = "paddock.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paddock"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting them makes diffs against future autogenerated
# revisions unreadable. Our hand-edits are commented so they stay visible.
"migrations/versions/*" = ["E501"]
# The Chinese half of the UI string table. RUF001 flags fullwidth punctuation as
# "ambiguous", which it is in an identifier and correct in a Chinese sentence — a
# halfwidth comma there is simply wrong typography. A `noqa` per line would be
# louder than the rule it silences.
"src/paddock/ui/text.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
# Third-party packages without stubs. Kept explicit rather than a blanket ignore so
# the list stays short and visible.
[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*", "langgraph.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `tests.doubles` is importable from any test module. The doubles live under
# tests/ rather than src/ so that nothing in production can import a fake LLM.
pythonpath = ["."]
markers = [
    "integration: requires a running Postgres (deselect with '-m \"not integration\"')",
    "live: hits racing.hkjc.com — never runs in CI",
    "model: loads bge-m3 (~2.2 GB download) — run locally with '-m model'",
    "ui: drives the Streamlit demo — needs the `ui` extra ('-m ui')",
]
# `model` is excluded by default for the same reason as `live`: it needs a 2.2 GB
# download from Hugging Face, which would make every CI run depend on a third party
# being up. Run it locally after touching anything in `paddock.embed`.
# `ui` joins them for a different reason: streamlit is an optional extra, and the
# rest of the suite runs on a bare `uv sync`. CI installs every extra and runs it in
# a step of its own; locally, `make test-ui`.
addopts = "-m 'not live and not model and not ui'"
